spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/user_db}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:user_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

prolean:
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  internal:
    callers:
      auth-service-2026-10:
        secret: ${INTERNAL_KEY_AUTH_SERVICE:dev-auth-service-key}
        scopes:
          - "GET /internal/users/*"
          - "GET /internal/users/*/auth-context"
          - "POST /internal/users/bootstrap"
      task-service-2026-10:
        secret: ${INTERNAL_KEY_TASK_SERVICE:dev-task-service-key}
        scopes:
          - "GET /internal/users/*"
          - "GET /internal/projects/*/access"
      timeline-service-2026-10:
        secret: ${INTERNAL_KEY_TIMELINE_SERVICE:dev-timeline-service-key}
        scopes:
          - "GET /internal/projects/*/access"
  services:
    auth:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
      internal-key-id: user-service-2026-10
      internal-api-key: ${INTERNAL_KEY_USER_SERVICE:dev-user-service-key}
