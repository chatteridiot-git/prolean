spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/auth_db}
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:auth_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

prolean:
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    key-id: ${AUTH_JWT_KEY_ID:dev-2026-10}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    retired-public-keys: ${JWT_RETIRED_PUBLIC_KEYS:[]}
    access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${AUTH_REFRESH_TOKEN_TTL_DAYS:7}
    bootstrap-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    bootstrap-full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
    bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  internal:
    callers:
      user-service-2026-10:
        secret: ${INTERNAL_KEY_USER_SERVICE:dev-user-service-key}
        scopes:
          - "POST /internal/users/*/revoke-tokens"
  services:
    user:
      base-url: ${USER_SERVICE_URL:http://localhost:8082}
      internal-key-id: auth-service-2026-10
      internal-api-key: ${INTERNAL_KEY_AUTH_SERVICE:dev-auth-service-key}
