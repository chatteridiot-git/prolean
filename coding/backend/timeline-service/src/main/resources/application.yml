spring:
  application:
    name: timeline-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/timeline_db}
    username: ${DB_USERNAME:timeline_service}
    password: ${DB_PASSWORD:timeline_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

prolean:
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  timeline:
    zone: ${TIMELINE_ZONE:Asia/Jakarta}
    coverage-start: ${HOLIDAY_COVERAGE_START:2025-01-01}
    coverage-end: ${HOLIDAY_COVERAGE_END:2027-12-31}
  services:
    user:
      base-url: ${USER_SERVICE_URL:http://localhost:8082}
      internal-key-id: timeline-service-2026-10
      internal-api-key: ${INTERNAL_KEY_TIMELINE_SERVICE:dev-timeline-service-key}
